<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Gerador de Relatórios - Telemetria</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        body { 
            font-family: sans-serif; 
            background: #121212; 
            color: white; 
            text-align: center; 
            padding: 20px; 
        }
        .ui-panel { 
            background: #1e1e1e; 
            padding: 25px 30px; 
            border-radius: 12px; 
            border: 1px solid #e67e22; 
            display: inline-block; 
            min-width: 420px; 
            margin-bottom: 20px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        label { 
            font-size: 14px; 
            color: #aaa; 
            display: block; 
            margin-bottom: 8px; 
            text-align: left; 
        }
        select { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 20px; 
            border-radius: 6px; 
            border: 1px solid #444; 
            font-size: 15px; 
            background: #2c2c2c; 
            color: white; 
            box-sizing: border-box; 
            outline: none;
        }
        select:focus {
            border-color: #e67e22;
        }
        .btn-group { 
            display: flex; 
            gap: 10px; 
            justify-content: center; 
        }
        button { 
            background: #e67e22; 
            color: white; 
            border: none; 
            padding: 14px 20px; 
            cursor: pointer; 
            font-weight: bold; 
            border-radius: 8px; 
            width: 100%; 
            transition: 0.2s; 
            font-size: 14px;
        }
        button:hover { 
            background: #d35400; 
        }
        #status { 
            margin-top: 15px; 
            color: #ffcc00; 
            font-size: 14px; 
        }

        /* ÁREA DE RENDERIZAÇÃO DO PDF (OCULTA) */
        #print-area { 
            position: absolute;
            left: 0;
            top: 0;
            width: 1000px;
            background: #121212;
            padding: 30px;
            box-sizing: border-box;
            transform: translateX(-2000px);
        }
        
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-end; 
            border-bottom: 3px solid #e67e22; 
            padding-bottom: 10px; 
            margin-bottom: 20px; 
        }
        .map-container { 
            width: 940px; 
            height: 1100px; 
            border-radius: 15px; 
            border: 1px solid #333; 
            background: #000; 
            position: relative; 
        }
    </style>
</head>
<body>

    <div class="ui-panel">
        <h2 style="color:#e67e22; margin:0 0 15px 0;">🛰️ Relatório de Telemetria</h2>
        
        <!-- SELEÇÃO DO CARRO -->
        <label for="carSelect">Selecione o Competidor / Carro:</label>
        <select id="carSelect">
            <option value="">Carregando competidores...</option>
        </select>

        <div class="btn-group">
            <button onclick="gerarPdfCarroSelecionado()">GERAR PDF DO CARRO SELECIONADO</button>
        </div>

        <div id="status">Aguardando comando...</div>
    </div>

    <!-- AREA CAPTURADA PELO HTML2CANVAS -->
    <div id="print-area">
        <div class="header">
            <div>
                <h1 style="color:#e67e22; margin:0; font-size: 32px;">Análise de Rastro</h1>
            </div>
            <div id="pdf-carro" style="font-size: 24px; font-weight: bold;">--</div>
        </div>
        <div id="map-temp" class="map-container"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBPJkehV9C1x0hiY5dQSwSRtVf5c4P2JGE",
            databaseURL: "https://cronometro-rally-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const map = L.map('map-temp', { 
            zoomControl: false, 
            attributionControl: false,
            preferCanvas: true 
        }).setView([0, 0], 13);
        
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}').addTo(map);
        const camadaElementos = L.featureGroup().addTo(map);

        // Preenche o Select com os competidores do banco de dados
        db.ref('competidores').on('value', snap => {
            const select = document.getElementById('carSelect');
            let html = '<option value="">-- Selecione um Carro --</option>';
            if (snap.exists()) {
                snap.forEach(c => { 
                    let nomeCompetidor = c.val().nome || c.key;
                    html += `<option value="${c.key}">${nomeCompetidor}</option>`; 
                });
            } else {
                html = '<option value="">Nenhum competidor encontrado</option>';
            }
            select.innerHTML = html;
        });

        // Executa a geração APENAS para o id selecionado no dropdown
        async function gerarPdfCarroSelecionado() {
            const idCarro = document.getElementById('carSelect').value;
            const status = document.getElementById('status');

            if (!idCarro) {
                alert("Por favor, escolha um carro no menu antes de gerar o PDF.");
                return;
            }

            status.innerText = `Buscando telemetria do veículo...`;

            try {
                const snapPiloto = await db.ref('competidores/' + idCarro).once('value');
                const nomePiloto = snapPiloto.exists() ? (snapPiloto.val().nome || idCarro) : idCarro;

                status.innerText = `Gerando PDF de: ${nomePiloto}...`;

                const canvas = await prepararECapturar(idCarro, nomePiloto);
                if (!canvas) {
                    status.innerHTML = "❌ Sem dados de rastro gravados para este carro.";
                    return;
                }

                const { jsPDF } = window.jspdf;
                const docIndiv = new jsPDF('p', 'mm', 'a4');
                const imgData = canvas.toDataURL('image/jpeg', 0.85);
                docIndiv.addImage(imgData, 'JPEG', 0, 0, 210, 297);
                
                // Salva somente o PDF do veículo escolhido
                docIndiv.save(`Relatorio_${idCarro}.pdf`);

                status.innerHTML = "✅ PDF GERADO COM SUCESSO!";
            } catch (err) {
                console.error(err);
                status.innerHTML = `❌ Erro ao gerar: ${err.message}`;
            }
        }

        async function prepararECapturar(id, nome) {
            camadaElementos.clearLayers();
            const [snapR, snapO] = await Promise.all([
                db.ref('rastros/' + id).once('value'),
                db.ref('configuracoes/percurso').once('value')
            ]);

            if (!snapR.exists()) return null;
            let rastro = Object.values(snapR.val()).sort((a,b) => a.ts - b.ts);
            let infraMap = new Map();

            // Desenha percurso e zonas
            if(snapO.exists()) {
                snapO.val().features.forEach(feat => {
                    if(feat.geometry.type === 'LineString') {
                        L.polyline(feat.geometry.coordinates.map(c => [c[1], c[0]]), {color: '#3498db', weight: 4, opacity: 0.5}).addTo(camadaElementos);
                    }
                    if(feat.properties?.type === 'circle') {
                        let visitou = rastro.some(p => (turf.distance(turf.point([p.lng, p.lat]), turf.point(feat.geometry.coordinates))*1000) <= (feat.properties.radius || 50));
                        L.circle([feat.geometry.coordinates[1], feat.geometry.coordinates[0]], { radius: feat.properties.radius || 50, color: visitou ? '#38a169' : '#e74c3c', fillOpacity: 0.2, weight: 2 }).addTo(camadaElementos);
                    }
                    else if(feat.geometry.type.includes('Polygon')) {
                        const vMax = (feat.properties.velocidade || 60) * 1.1;
                        rastro.forEach((p, i) => {
                            if(i > 0) {
                                const dur = p.ts - rastro[i-1].ts;
                                if(dur < 30000 && p.vel > vMax && turf.booleanPointInPolygon(turf.point([p.lng, p.lat]), feat)) {
                                    infraMap.set(p.ts, true);
                                }
                            }
                        });
                    }
                });
            }

            // 1. RASTRO EM LINHA CONTÍNUA (AMARELA)
            const latLngs = rastro.map(p => [p.lat, p.lng]);
            if (latLngs.length > 0) {
                L.polyline(latLngs, {
                    color: '#ffff00',
                    weight: 3,
                    opacity: 0.85,
                    smoothFactor: 1
                }).addTo(camadaElementos);
            }

            // 2. DESTACA INFRAÇÕES COM PONTOS VERMELHOS
            rastro.forEach((p) => {
                if (infraMap.has(p.ts)) {
                    L.circleMarker([p.lat, p.lng], {
                        radius: 5,
                        color: '#7B0000',
                        fillColor: 'red',
                        fillOpacity: 1,
                        weight: 1
                    }).addTo(camadaElementos);
                }
            });

            document.getElementById('pdf-carro').innerText = nome || id;

            map.invalidateSize();
            
            if (camadaElementos.getLayers().length > 0) {
                map.fitBounds(camadaElementos.getBounds(), { padding: [50, 50], animate: false });
            }

            await new Promise(res => setTimeout(res, 3000));

            return await html2canvas(document.getElementById('print-area'), { 
                useCORS: true, 
                backgroundColor: "#121212", 
                scale: 2,
                width: 1000,
                height: 1250,
                x: 0,
                y: 0
            });
        }
    </script>
</body>
</html>
