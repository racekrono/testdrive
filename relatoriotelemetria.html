<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Relatórios - Race Krono</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #121212; 
            color: #ffffff; 
            text-align: center; 
            padding: 20px; 
            margin: 0;
        }
        .ui-panel { 
            background: #1e1e1e; 
            padding: 25px 30px; 
            border-radius: 12px; 
            border: 1px solid #ff9800; 
            display: inline-block; 
            width: 90%;
            max-width: 480px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }
        h2 {
            color: #ff9800;
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 22px;
        }
        label { 
            font-size: 14px; 
            color: #ccc; 
            display: block; 
            margin-bottom: 8px; 
            text-align: left; 
            font-weight: bold;
        }
        select { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 20px; 
            border-radius: 8px; 
            border: 1px solid #444; 
            font-size: 15px; 
            background: #2b2b2b; 
            color: #fff; 
            box-sizing: border-box; 
            outline: none;
        }
        select:focus {
            border-color: #ff9800;
        }
        .btn-main { 
            background: #ff9800; 
            color: #000; 
            border: none; 
            padding: 14px 20px; 
            cursor: pointer; 
            font-weight: bold; 
            border-radius: 8px; 
            width: 100%; 
            transition: 0.2s; 
            font-size: 15px;
            text-transform: uppercase;
        }
        .btn-main:hover { 
            background: #e68a00; 
        }
        #status { 
            margin-top: 15px; 
            color: #ffcc00; 
            font-size: 14px; 
            min-height: 20px;
            font-weight: 500;
        }

        /* ÁREA DE RENDERIZAÇÃO DO PDF (POSICIONADA FORA DA TELA SEM Ocultar Canvas) */
        #print-area { 
            position: fixed;
            top: 0;
            left: -9999px;
            width: 1000px;
            background: #121212;
            padding: 30px;
            box-sizing: border-box;
            z-index: -9999;
        }
        
        .header-pdf { 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-end; 
            border-bottom: 3px solid #ff9800; 
            padding-bottom: 10px; 
            margin-bottom: 20px; 
        }
        .map-container { 
            width: 940px; 
            height: 1100px; 
            border-radius: 12px; 
            border: 1px solid #333; 
            background: #000; 
            position: relative; 
        }
    </style>
</head>
<body>

    <div class="ui-panel">
        <h2>🛰️ Relatório de Telemetria</h2>
        
        <label for="carSelect">Selecione o Competidor / Carro:</label>
        <select id="carSelect">
            <option value="">Carregando lista de veículos...</option>
        </select>

        <button class="btn-main" onclick="gerarPdfCarroUnico()">GERAR PDF DO CARRO SELECIONADO</button>

        <div id="status">Aguardando seleção...</div>
    </div>

    <!-- ÁREA CAPTURADA PELO HTML2CANVAS -->
    <div id="print-area">
        <div class="header-pdf">
            <div>
                <h1 style="color:#ff9800; margin:0; font-size: 32px;">Análise de Telemetria</h1>
            </div>
            <div id="pdf-carro" style="font-size: 26px; font-weight: bold; color: #ffffff;">--</div>
        </div>
        <div id="map-temp" class="map-container"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBPJkehV9C1x0hiY5dQSwSRtVf5c4P2JGE",
            databaseURL: "https://cronometro-rally-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Inicialização do Mapa Leaflet com Canvas
        const map = L.map('map-temp', { 
            zoomControl: false, 
            attributionControl: false,
            preferCanvas: true 
        }).setView([0, 0], 13);
        
        // Habilita crossOrigin no TileLayer para permitir captura pelo html2canvas
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            crossOrigin: true
        }).addTo(map);

        const camadaElementos = L.featureGroup().addTo(map);

        // Detecta parâmetro de URL se enviado (ex: ?carro=101)
        const urlParams = new URLSearchParams(window.location.search);
        const carFromUrl = urlParams.get('carro') || urlParams.get('id');

        // Carrega competidores no menu <select>
        db.ref('competidores').on('value', snap => {
            const select = document.getElementById('carSelect');
            let html = '<option value="">-- Escolha um Carro --</option>';
            
            if (snap.exists()) {
                snap.forEach(c => { 
                    let data = c.val();
                    let nomeCompetidor = (data && data.nome) ? `${c.key} - ${data.nome}` : `Carro ${c.key}`;
                    let selected = (carFromUrl === c.key) ? 'selected' : '';
                    html += `<option value="${c.key}" ${selected}>${nomeCompetidor}</option>`; 
                });
            } else {
                html = '<option value="">Nenhum competidor encontrado</option>';
            }
            select.innerHTML = html;
        });

        async function gerarPdfCarroUnico() {
            const idCarro = document.getElementById('carSelect').value;
            const status = document.getElementById('status');

            if (!idCarro) {
                alert("Selecione um veículo no menu antes de gerar o PDF.");
                return;
            }

            status.innerText = `Buscando dados do veículo ${idCarro}...`;

            try {
                const snapPiloto = await db.ref('competidores/' + idCarro).once('value');
                const nomePiloto = snapPiloto.exists() ? (snapPiloto.val().nome || `Carro ${idCarro}`) : `Carro ${idCarro}`;

                status.innerText = `Processando mapa de: ${nomePiloto}...`;

                const canvas = await prepararECapturar(idCarro, nomePiloto);
                if (!canvas) {
                    status.innerHTML = "❌ Não há registros de rastro para este carro.";
                    return;
                }

                status.innerText = `Gerando arquivo PDF...`;

                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF('p', 'mm', 'a4');
                const imgData = canvas.toDataURL('image/jpeg', 0.90);
                pdf.addImage(imgData, 'JPEG', 0, 0, 210, 297);
                
                pdf.save(`Relatorio_Telemetria_${idCarro}.pdf`);

                status.innerHTML = "✅ PDF Gerado com sucesso!";
            } catch (err) {
                console.error(err);
                status.innerHTML = `❌ Erro na geração: ${err.message}`;
            }
        }

        async function prepararECapturar(id, nome) {
            camadaElementos.clearLayers();

            const [snapR, snapO] = await Promise.all([
                db.ref('rastros/' + id).once('value'),
                db.ref('configuracoes/percurso').once('value')
            ]);

            if (!snapR.exists()) return null;

            let valRastro = snapR.val();
            let rastroArray = Array.isArray(valRastro) ? valRastro : Object.values(valRastro);
            
            // Filtra coordenadas válidas e ordena por timestamp
            let rastro = rastroArray
                .filter(p => p && typeof p.lat === 'number' && typeof p.lng === 'number')
                .sort((a,b) => (a.ts || 0) - (b.ts || 0));

            if (rastro.length === 0) return null;

            // Desenha linhas do percurso oficial (se existirem)
            if (snapO.exists() && snapO.val().features) {
                snapO.val().features.forEach(feat => {
                    if (feat.geometry && feat.geometry.type === 'LineString') {
                        L.polyline(feat.geometry.coordinates.map(c => [c[1], c[0]]), {
                            color: '#3498db', 
                            weight: 3, 
                            opacity: 0.4 
                        }).addTo(camadaElementos);
                    }
                });
            }

            // APENAS LINHA CONTÍNUA PARA O RASTRO (SEM BOLINHAS)
            const latLngs = rastro.map(p => [p.lat, p.lng]);
            L.polyline(latLngs, {
                color: '#ffff00',
                weight: 4,
                opacity: 0.9,
                smoothFactor: 1
            }).addTo(camadaElementos);

            document.getElementById('pdf-carro').innerText = `${id} - ${nome}`;

            map.invalidateSize();
            
            if (camadaElementos.getLayers().length > 0) {
                map.fitBounds(camadaElementos.getBounds(), { padding: [40, 40], animate: false });
            }

            // Aguarda 2 segundos para garantir o carregamento completo dos tiles do mapa
            await new Promise(res => setTimeout(res, 2000));

            return await html2canvas(document.getElementById('print-area'), { 
                useCORS: true, 
                allowTaint: true,
                backgroundColor: "#121212", 
                scale: 2,
                width: 1000,
                height: 1250
            });
        }
    </script>
</body>
</html>
