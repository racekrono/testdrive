<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Race Krono - Test Drive</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; overflow: hidden; }
        .card { background: #1e1e1e; padding: 30px; border-radius: 16px; width: 320px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .logo { width: 120px; height: 120px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px auto; }
        .logo img { width: 90%; }
        h3 { margin: 10px 0 20px 0; font-size: 20px; }
        input { width: 100%; padding: 14px; border-radius: 8px; border: 1px solid #333; background: #2a2a2a; color: white; font-size: 16px; box-sizing: border-box; margin-bottom: 20px; }
        button { width: 100%; padding: 16px; border-radius: 8px; border: none; background: #ff0000; color: white; font-weight: bold; font-size: 16px; cursor: pointer; text-transform: uppercase; }
        button:hover { background: #cc0000; }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo">
            <img src="https://racekrono.github.io/testdrive/logo.png" alt="Race Krono" onerror="this.src='https://via.placeholder.com/100?text=RACE+KRONO'">
        </div>
        <h3>Test Drive</h3>
        <input type="text" id="nomePiloto" placeholder="Digite seu nome/ID">
        <button id="btnIniciar" onclick="iniciarProva()">INICIAR PROVA</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBPJkehV9C1x0hiY5dQSwSRtVf5c4P2JGE",
            databaseURL: "https://cronometro-rally-default-rtdb.firebaseio.com"
        };
        
        // Inicializa o Firebase apenas se não estiver inicializado
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        async function iniciarProva() {
            const input = document.getElementById('nomePiloto');
            const nome = input.value.trim();

            if (!nome) {
                alert("Por favor, digite seu nome ou ID para continuar.");
                return;
            }

            const btn = document.getElementById('btnIniciar');
            btn.disabled = true;
            btn.innerText = "INICIANDO...";

            try {
                // Registra/Atualiza o competidor no Firebase Realtime Database
                await db.ref('competidores/' + nome.toLowerCase()).set({
                    nome: nome,
                    status: "EM_PROVA",
                    inicioTS: Date.now()
                });

                localStorage.setItem('pilotoAtual', nome.toLowerCase());

                // Redireciona para o painel do piloto ou rastreador
                window.location.href = "rastro.html?carro=" + encodeURIComponent(nome.toLowerCase());
            } catch (err) {
                console.error("Erro ao iniciar prova:", err);
                alert("Erro ao conectar com o servidor: " + err.message);
                btn.disabled = false;
                btn.innerText = "INICIAR PROVA";
            }
        }
    </script>
</body>
</html>
